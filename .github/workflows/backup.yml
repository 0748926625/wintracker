name: Sauvegarde automatique par email

on:
  schedule:
    - cron: '0 22 * * *' # chaque jour à 22:00 UTC (= heure d'Abidjan)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export des données
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/export-backup.mjs

      - name: Envoi par email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: WINTRACKER <${{ secrets.GMAIL_ADDRESS }}>
          to: nanouaboyaguy@gmail.com,winnerexpress.ci@gmail.com
          subject: "Sauvegarde WINTRACKER — ${{ env.BACKUP_DATE }}"
          body: file://backup-summary.txt
          attachments: ${{ env.BACKUP_FILE }}
